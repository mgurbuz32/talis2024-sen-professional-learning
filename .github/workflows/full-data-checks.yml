name: Full TALIS data checks

on:
  push:
    paths:
      - 'tools/full_data_checks.py'
      - '.github/workflows/full-data-checks.yml'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install numpy pandas scipy
      - name: Download OECD TALIS 2024 teacher CSV archive
        run: |
          curl -L --fail --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 1200 \
            -A 'Mozilla/5.0' \
            -o TALIS2024_teachers_NoESE_CSV.zip \
            https://webfs.oecd.org/talis/2024/core/TALIS2024_teachers_NoESE_CSV.zip
          ls -lh TALIS2024_teachers_NoESE_CSV.zip
      - name: Run full-data checks
        run: python tools/full_data_checks.py
      - name: Upload aggregate outputs only
        uses: actions/upload-artifact@v4
        with:
          name: talis-full-data-checks
          path: full_checks_output/
          retention-days: 7

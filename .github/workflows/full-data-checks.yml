name: Full TALIS data checks

on:
  push:
    paths:
      - 'tools/full_data_checks.py'
      - '.github/workflows/full-data-checks.yml'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install numpy pandas scipy
      - name: Download OECD TALIS 2024 teacher CSV archive
        run: |
          python - <<'PY'
          import urllib.request, time
          url='https://webfs.oecd.org/talis/2024/core/TALIS2024_teachers_NoESE_CSV.zip'
          out='TALIS2024_teachers_NoESE_CSV.zip'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=120) as r, open(out,'wb') as f:
              total=int(r.headers.get('Content-Length') or 0); got=0; last=0
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk: break
                  f.write(chunk); got += len(chunk)
                  if got-last >= 20*1024*1024:
                      print(f'downloaded {got/1024/1024:.1f} MB of {total/1024/1024:.1f} MB', flush=True); last=got
          print('download complete', got, flush=True)
          PY
      - name: Run full-data checks
        run: python tools/full_data_checks.py
      - name: Upload aggregate outputs only
        uses: actions/upload-artifact@v4
        with:
          name: talis-full-data-checks
          path: full_checks_output/
          retention-days: 7
